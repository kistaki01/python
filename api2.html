<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Directory</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(120deg, #f1f5f9, #e0e7ff);
            min-height: 100vh;
            padding: 40px 20px;
            color: #1f2937;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
            color: #020617;
        }

        #status-message {
            text-align: center;
            font-size: 18px;
            margin-top: 30px;
            color: #475569;
        }

        .error {
            color: #dc2626;
            font-weight: bold;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .car-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.12);
        }

        .car-id {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .car-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #020617;
        }

        .car-year {
            font-size: 15px;
            color: #2563eb;
        }
    </style>
</head>
<body>

<h1>Car Directory</h1>

<div id="status-message">Loading cars...</div>

<div class="card-grid" id="car-container"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetchCars();
    });

    async function fetchCars() {
        const container = document.getElementById("car-container");
        const statusMessage = document.getElementById("status-message");

        try {
            const response = await fetch('https://surveys-5jvt.onrender.com/api/cars/');

            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status}`);
            }

            const cars = await response.json();

            // 👉 API válasz kiírása konzolra
            console.log("Cars API válasz:", cars);

            statusMessage.style.display = "none";

            cars.forEach(car => {
                const card = document.createElement("div");
                card.className = "car-card";

                card.innerHTML = `
                    <div class="car-id">Car ID: ${car.id}</div>
                    <div class="car-name">
                        ${car.brand ?? "Unknown brand"} ${car.model ?? ""}
                    </div>
                    <div class="car-year">
                        Year: ${car.year ?? "N/A"}
                    </div>
                `;

                container.appendChild(card);
            });

        } catch (error) {
            console.error("Hiba:", error);
            statusMessage.textContent = "Failed to load car data.";
            statusMessage.classList.add("error");
        }
    }
</script>

</body>
</html>
